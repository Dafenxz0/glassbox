[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-decompiler"
version = "0.1.0"
description = "Verifiable neural-network-to-program decompiler via CEGIS and SMT verification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "onnx",
    "onnxruntime",
    "z3-solver",
    "scikit-learn",
    "sympy",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "typer",
    "rich",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[project.scripts]
glassbox = "glassbox.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
