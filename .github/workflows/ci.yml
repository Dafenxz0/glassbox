name: GlassBox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify GCC, Clang, and Rust toolchains
        run: |
          gcc --version
          clang --version
          rustc --version

      - name: Install GlassBox with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check src tests scripts

      - name: Check Studio and build its static distribution
        run: |
          node --check studio/app.js
          node --check site/assets/home.js
          python scripts/build_web.py

      - name: Replay the versioned drone proof
        run: glassbox verify bundles/drone_altitude_pid.gbundle --timeout 30

      - name: Run pytest suite
        run: pytest -v

      - name: Cross-compiler C99 (GCC + Clang), Rust, and bundle verification smoke test
        run: |
          rm -rf /tmp/gb_out
          glassbox decompile models/drone_altitude_pid.onnx --out /tmp/gb_out --targets c,rust,python --bundle
          gcc -Wall -Wextra -Werror -std=c99 -O3 -DGLASSBOX_MAIN /tmp/gb_out/drone_altitude_pid.c -lm -o /tmp/gb_gcc_test
          /tmp/gb_gcc_test
          clang -Wall -Wextra -Werror -std=c99 -O3 -DGLASSBOX_MAIN /tmp/gb_out/drone_altitude_pid.c -lm -o /tmp/gb_clang_test
          /tmp/gb_clang_test
          rustc --test -D warnings /tmp/gb_out/drone_altitude_pid.rs -o /tmp/gb_rs_test
          /tmp/gb_rs_test
          glassbox verify /tmp/gb_out/drone_altitude_pid.gbundle --timeout 30
